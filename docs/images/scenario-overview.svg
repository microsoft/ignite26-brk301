<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
<title id="title">One hotel, three agents, two scenarios</title>
<desc id="description">Hotel Guest Services answers grounded customer questions. Hotel Payroll and Hotel Treasurer coordinate a synthetic payroll transfer with human approval.</desc>
