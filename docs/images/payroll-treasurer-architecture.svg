<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
<title id="title">Hotel Payroll and Hotel Treasurer architecture</title>
<desc id="description">Two separately hired agents collaborate in the Payroll Funding Microsoft Teams chat. An authenticated human approves before Hotel Treasurer executes an idempotent transfer in the authoritative synthetic ledger. Fabric receives an analytical projection only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text id="payroll-treasurer-architecture-0" x="40" y="64" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000000" data-max-width="1100">
<tspan x="40" dy="0">Hotel Payroll + Hotel Treasurer</tspan>
</text>
<text id="payroll-treasurer-architecture-1" x="40" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="1100">
<tspan x="40" dy="0">Two agents with accounts  /  Distinct Agent 365 identities  /  One shared chat</tspan>
</text>
<rect id="payroll-treasurer-architecture-2" x="390" y="140" width="420" height="115" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="payroll-treasurer-architecture-3" x="410" y="183" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="380">
<tspan x="410" dy="0">Microsoft Teams</tspan>
</text>
<text id="payroll-treasurer-architecture-4" x="410" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="380">
<tspan x="410" dy="0">Payroll Funding group chat</tspan>
</text>
<rect id="payroll-treasurer-architecture-5" x="40" y="330" width="330" height="140" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="payroll-treasurer-architecture-6" x="60" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="290">
<tspan x="60" dy="0">Hotel Payroll</tspan>
</text>
<text id="payroll-treasurer-architecture-7" x="60" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="290">
<tspan x="60" dy="0">Identify the shortfall</tspan>
<tspan x="60" dy="27.0">Request funding</tspan>
</text>
<rect id="payroll-treasurer-architecture-8" x="445" y="330" width="310" height="140" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text id="payroll-treasurer-architecture-9" x="465" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="270">
<tspan x="465" dy="0">Authorized human</tspan>
</text>
<text id="payroll-treasurer-architecture-10" x="465" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="270">
<tspan x="465" dy="0">Approve the pending</tspan>
<tspan x="465" dy="27.0">USD 15,000 transfer</tspan>
</text>
<rect id="payroll-treasurer-architecture-11" x="830" y="330" width="330" height="140" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text id="payroll-treasurer-architecture-12" x="850" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Hotel Treasurer</tspan>
</text>
<text id="payroll-treasurer-architecture-13" x="850" y="410" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Coordinate approval</tspan>
<tspan x="850" dy="27.0">Execute authorized transfer</tspan>
</text>
<polyline id="payroll-treasurer-architecture-14" points="475,260 475,290 205,290 205,325" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline id="payroll-treasurer-architecture-15" points="725,260 725,290 995,290 995,325" fill="none" stroke="#5C2D91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline id="payroll-treasurer-architecture-16" points="600,260 600,325" fill="none" stroke="#F7630C" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
