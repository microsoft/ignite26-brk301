<text id="payroll-treasurer-architecture-20" x="75" y="645" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="220">
<tspan x="75" dy="0">Foundry IQ policies</tspan>
<tspan x="75" dy="27.0">Both workflow modes</tspan>
</text>
<rect id="payroll-treasurer-architecture-21" x="330" y="615" width="340" height="75" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="payroll-treasurer-architecture-22" x="345" y="645" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="310">
<tspan x="345" dy="0">Fabric IQ + Work IQ</tspan>
<tspan x="345" dy="27.0">Default three_iq mode</tspan>
</text>
<polyline id="payroll-treasurer-architecture-23" points="205,475 205,550" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="payroll-treasurer-architecture-24" points="825,405 785,405 785,630 695,630" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect id="payroll-treasurer-architecture-25" x="830" y="555" width="330" height="155" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text id="payroll-treasurer-architecture-26" x="850" y="598" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Synthetic ledger</tspan>
</text>
<text id="payroll-treasurer-architecture-27" x="850" y="635" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Approval + idempotency</tspan>
<tspan x="850" dy="27.0">Financial write authority</tspan>
</text>
<polyline id="payroll-treasurer-architecture-28" points="995,475 995,550" fill="none" stroke="#107C10" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="payroll-treasurer-architecture-29" x="1008" y="517" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000000" data-max-width="170">
<tspan x="1008" dy="0">Only after approval</tspan>
</text>
<rect id="payroll-treasurer-architecture-30" x="830" y="795" width="330" height="110" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text id="payroll-treasurer-architecture-31" x="850" y="838" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Fabric projection</tspan>
</text>
<text id="payroll-treasurer-architecture-32" x="850" y="875" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="290">
<tspan x="850" dy="0">Analytics only</tspan>
</text>
<polyline id="payroll-treasurer-architecture-33" points="995,715 995,790" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="payroll-treasurer-architecture-34" x="1010" y="757" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000000" data-max-width="145">
<tspan x="1010" dy="0">Project state</tspan>
</text>
<rect id="payroll-treasurer-architecture-35" x="40" y="795" width="650" height="110" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text id="payroll-treasurer-architecture-36" x="60" y="838" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000000" data-max-width="610">
<tspan x="60" dy="0">Shared-chat demo: collaboration mode</tspan>
</text>
<text id="payroll-treasurer-architecture-37" x="60" y="875" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" data-max-width="610">
<tspan x="60" dy="0">Default three_iq also requires physical projection checks.</tspan>
</text>
<text id="payroll-treasurer-architecture-38" x="40" y="948" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" data-max-width="1100">
