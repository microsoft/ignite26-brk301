[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-payroll-treasurer-agents"
version = "0.1.0"
description = "Hotel Payroll and Hotel Treasurer agents with accounts"
requires-python = ">=3.11"
dependencies = [
    "azure-identity==1.25.3",
    "azure-storage-blob==12.30.0",
]

[project.optional-dependencies]
host = [
    "microsoft-agents-activity==1.1.0",
    "microsoft-agents-hosting-core==1.1.0",
    "microsoft-agents-authentication-msal==1.1.0",
    "aiohttp==3.14.4",
    "httpx==0.28.1",
    "microsoft-agents-a365-notifications==0.1.0",
    "PyJWT==2.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
